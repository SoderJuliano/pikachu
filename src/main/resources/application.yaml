spring:
  application:
    name: pikachu

server:
  port: 5300

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  timeout:
    default: 240 # 4 minutes — nao se aplica a endpoints SSE (ver TimeoutFilter)
  ollama:
    # Teto da janela de contexto. O valor real por request e calculado pelo
    # tamanho do prompt (ver OllamaClientAdapter.resolveNumCtx): pergunta curta
    # segue em 4096, prompt do modo IDE sobe ate este teto. Subir isto custa VRAM.
    #
    # O qwen3.6 suporta 256K de contexto. O teto estava em 32768 — 1/8 disso — e
    # era ELE que apertava o modo agente: o cliente tinha que espremer prompt,
    # resultado de ferramenta e espaco de geracao dentro de 32k, e cada aperto
    # quebrava outra coisa (turno sem resposta, arquivo lido pela metade,
    # leitura anterior expulsa pela seguinte).
    #
    # 65536 e um passo conservador: dobra o espaco util e ainda cabe com folga
    # num 35b de 24GB. KV cache cresce linear com a janela — se der OOM no
    # servidor, baixe de volta pra 32768. Subir pra 131072+ so com VRAM sobrando.
    max-num-ctx: 65536

# Modulo WoW Classic Plus LK (contas AzerothCore). Chaves da fila e credenciais do
# banco NAO ficam aqui: vem do secrets.txt (WOWLK_QUEUE_REGISTRATION_KEY,
# WOWLK_QUEUE_EVENTS_KEY, WOWLK_DB_URL, WOWLK_DB_USER, WOWLK_DB_PASSWORD e,
# opcional, WOWLK_QUEUE_PRIVATE_KEY_PATH).
wowlk:
  enabled: true
  abra-base-url: https://abra-api.top
  poll-interval-ms: 120000      # consulta a fila de cadastro a cada 2 min
  poll-initial-delay-ms: 20000
  max-attempts: 3               # na 3a falha: e-mail de desculpas e a mensagem sai da fila
  max-registrations-per-run: 100
  access-token-ttl-seconds: 900
  refresh-token-ttl-seconds: 2592000
  min-launcher-version: 0.1.0
  maintenance: false
  realmlist: ru2esxz6.free.tryportwarp.cc:16943
  manifest-dir: /app/manifests   # <cliente>.json: o que o launcher baixa em GET /launcher/v1/manifest/<cliente>
  resident-bots: 20             # somado a jogadores online e contas no painel do site
  world-port: 8085

# Modulo de doacoes (pacote com.mcp.pikachu.donation) — Mercado Pago: Pix no Brasil, cartao fora.
# Segredos NAO ficam aqui: DONATION_MP_ACCESS_TOKEN, DONATION_MP_PUBLIC_KEY,
# e DONATION_MP_WEBHOOK_SECRET vem do secrets.txt (ou variaveis de ambiente).
# Doacoes confirmadas: MariaDB, wowlk_site.donation (mesmo banco/usuario do modulo wowlk).
# Webhook para cadastrar no painel do Mercado Pago: https://<host-publico>/donation/v1/webhooks/mercadopago
# Perfis de teste: application-local.yaml (Mercado Pago de teste) e application-mock.yaml (sem rede).
donation:
  enabled: true
  gateway: mercadopago          # mercadopago | mock
  store: jdbc                   # jdbc (MariaDB wowlk_site) | memory
  dev-tools: false              # NUNCA true em producao (libera a simulacao de webhook)
  notification-url: ""          # vazio = usa a URL configurada no painel de Webhooks do Mercado Pago
  test-payer-email: ""          # so em teste: e-mail do comprador de teste
  currency: BRL
  min-amount: 5
  max-amount: 1000
  fixed-amount: 29.90           # valor unico da doacao (BRL); 0 = valor livre entre min e max
  usd-equivalent: 5.04          # so exibicao fora do Brasil (cambio de 22/11/2026: 1 BRL = 0,1684 USD)
  client64-fixed-amount: 99.90  # valor unico da doacao do cliente 64-bit (wowlk_site.wowsixtyfordev)
  client64-usd-equivalent: 16.82 # so exibicao fora do Brasil (cambio de 22/11/2026)
  pix-expiration-minutes: 30
