spring:
  application:
    name: pikachu

server:
  port: 5300

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  timeout:
    default: 240 # 4 minutes — nao se aplica a endpoints SSE (ver TimeoutFilter)
  ollama:
    # Teto da janela de contexto. O valor real por request e calculado pelo
    # tamanho do prompt (ver OllamaClientAdapter.resolveNumCtx): pergunta curta
    # segue em 4096, prompt do modo IDE sobe ate este teto. Subir isto custa VRAM.
    #
    # O qwen3.6 suporta 256K de contexto. O teto estava em 32768 — 1/8 disso — e
    # era ELE que apertava o modo agente: o cliente tinha que espremer prompt,
    # resultado de ferramenta e espaco de geracao dentro de 32k, e cada aperto
    # quebrava outra coisa (turno sem resposta, arquivo lido pela metade,
    # leitura anterior expulsa pela seguinte).
    #
    # 65536 e um passo conservador: dobra o espaco util e ainda cabe com folga
    # num 35b de 24GB. KV cache cresce linear com a janela — se der OOM no
    # servidor, baixe de volta pra 32768. Subir pra 131072+ so com VRAM sobrando.
    max-num-ctx: 65536

# Modulo WoW Classic Plus LK (contas AzerothCore). Chaves da fila e credenciais do
# banco NAO ficam aqui: vem do secrets.txt (WOWLK_QUEUE_REGISTRATION_KEY,
# WOWLK_QUEUE_EVENTS_KEY, WOWLK_DB_URL, WOWLK_DB_USER, WOWLK_DB_PASSWORD e,
# opcional, WOWLK_QUEUE_PRIVATE_KEY_PATH).
wowlk:
  enabled: true
  abra-base-url: https://abra-api.top
  poll-interval-ms: 120000      # consulta a fila de cadastro a cada 2 min
  poll-initial-delay-ms: 20000
  max-attempts: 3               # na 3a falha: e-mail de desculpas e a mensagem sai da fila
  max-registrations-per-run: 100
  access-token-ttl-seconds: 900
  refresh-token-ttl-seconds: 2592000
  min-launcher-version: 0.1.0
  maintenance: false
  realmlist: ru2esxz6.free.tryportwarp.cc:16943
  cors-origins:
    - https://wowclassicpluslk.com
    - http://localhost:5173
    - http://localhost:4173
